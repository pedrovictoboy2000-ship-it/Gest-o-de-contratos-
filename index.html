<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--bg2:#f3f6fa;--sf:#fff;--tx:#2b3340;--mu:#6b7686;--bd:#e1e6ee;--nav:#5e1230;--nav2:#8a1c3f;--pr:#8a1c3f;--ln:#f6e6eb;--hv:#faf0f3;--ac:#c9962b;--g:#1e9e57;--y:#e5a400;--r:#d93a3a;--gb:#e3f5ea;--yb:#fff4d6;--rb:#fde4e4;--xb:#e9ecf0}

:root[data-tema=escuro]{--bg:#0d0d0d;--bg2:#000;--sf:#151515;--tx:#f2f2f2;--mu:#a0a0a0;--bd:#2c2c2c;--nav:#5e1230;--nav2:#8a1c3f;--pr:#c2305e;--ln:#2e1420;--hv:#1c1015;--gb:#0f2e22;--yb:#33290a;--rb:#3b1818;--xb:#222}

body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

.kpi.g{border-left-color:var(--g)}.kpi.y{border-left-color:var(--y)}.kpi.r{border-left-color:var(--r)}.kpi.x{border-left-color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0}dt{color:var(--mu);font-weight:600}dd{margin:0}
.tl{border-left:2px solid var(--ln);margin-left:7px;padding-left:20px}.tl>div{position:relative;margin-bottom:16px}
.tl>div:before{content:"";position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pr);border:2px solid var(--bg)}
.tl>div.now:before{background:var(--g)}
.pv{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.pv input[type=checkbox]{width:18px;height:18px;flex:none}
.pv input[type=text]{width:40%}

.modal>div{background:var(--bg);border-radius:10px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:20px}

.msg{border-radius:6px;padding:9px 12px;font-size:13px;margin:10px 0}.msg.w{background:var(--yb);color:#7a5800}.msg.e{background:var(--rb);color:var(--r)}.msg.i{background:var(--ln);color:var(--pr)}
.ev{font-size:12px;color:var(--mu);font-style:italic}.emp{text-align:center;color:var(--mu);padding:30px}
body{background:var(--bg2)}.wrap{padding-top:22px}h1.pt{font-size:22px;color:var(--tx)}
.crumb{background:none;padding:12px 16px 0;max-width:1180px;margin:auto;color:var(--mu)}
.top{box-shadow:0 2px 10px #0a1e4a30}
.tabs{border:0;gap:8px;padding:2px 0 4px}.tabs button{border:1px solid var(--bd);border-radius:20px;background:var(--bg);padding:7px 16px;margin:0;box-shadow:none;transition:.15s}
.tabs button:hover{border-color:var(--pr);color:var(--pr)}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr);box-shadow:0 3px 10px #0a4fb340}.tabs button.on .cnt{background:#ffffff33;color:#fff}
.card,.kpi{border:0;box-shadow:0 1px 2px #0a1e4a14,0 6px 20px #0a1e4a0d;border-radius:12px}

th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu)}th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--pr)}
tbody tr:nth-child(odd){background:none}td{border-bottom:1px solid var(--bg2)}tbody tr{transition:background .12s}tbody tr:hover td:first-child{box-shadow:inset 3px 0 var(--pr)}
.kpi{border-left:0;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bd)}.kpi.g:before{background:var(--g)}.kpi.y:before{background:var(--y)}.kpi.r:before{background:var(--r)}.kpi.x:before{background:var(--mu)}
.kpi:hover{transform:translateY(-3px);box-shadow:0 8px 26px #0a1e4a22}.kpi b{font-size:32px}
.btn{border-radius:8px;transition:.15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
input,select,textarea{border-radius:8px;transition:border-color .15s}
.al,.card[onclick]{transition:.15s}.card[onclick]:hover{transform:translateY(-2px)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:6px;min-width:90px}.bar i{display:block;height:100%;border-radius:3px;transition:width .6s}.bar i.g{background:var(--g)}.bar i.y{background:var(--y)}.bar i.r{background:var(--r)}.bar i.x{background:var(--mu)}
.big{text-align:center;min-width:90px}.big b{font-size:38px;line-height:1;display:block;color:var(--pr)}.big span{font-size:12px;color:var(--mu)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#app>*{animation:fi .28s ease both}.modal>div{animation:fi .22s ease both}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:24px;box-shadow:0 8px 24px #0005;z-index:40;animation:fi .25s ease both}
.top{background:linear-gradient(100deg,var(--nav),var(--nav2));border-bottom:3px solid var(--ac);box-shadow:0 4px 14px #4a0f2440}
.brand .logo{background:var(--ac);color:#fff}
.tabs button.on{box-shadow:0 4px 12px color-mix(in srgb,var(--pr) 28%,transparent)}

.kpi{padding:16px 16px 16px 22px}.kpi.g{background:var(--gb)}.kpi.y{background:var(--yb)}.kpi.r{background:var(--rb)}.kpi.x{background:var(--xb)}
.kpi.g b{color:var(--g)}.kpi.y b{color:#a87700}.kpi.r b{color:var(--r)}.kpi.on{outline:2px solid var(--pr)}.kpi:hover{box-shadow:0 10px 28px #4a0f2430}
.card h3{padding-bottom:8px;border-bottom:2px solid var(--ln)}th{border-bottom:2px solid var(--ln)}
.tl>div:before{background:var(--c,var(--pr))}.tl>div b{color:var(--c,var(--tx))}
.rm{font-size:11px;color:var(--mu);cursor:pointer;margin-left:6px;text-decoration:underline}.rm:hover{color:var(--r)}
.nb{background:var(--rb);color:var(--r);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600}
.doc{color:var(--pr);font-weight:600;text-decoration:none}.doc:hover{text-decoration:underline}#ib input{padding:6px 8px}#ib td{padding:5px 6px}.al[style*="--c"]{border-left:4px solid var(--c)}
.storage-note{font-size:12px;color:var(--mu);margin:8px 0}.backup-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
</style></head><body>
<div class="top"><div class="brand"><span class="logo">GC</span>Gestão de contratos - Jundiá RN</div><span class="sp"></span><span class="ent">● Prefeitura de Jundiá</span><button class="avatar" id="av" onclick="setTab('config')" title="Configurações"></button></div>
<div class="crumb" id="crumb"></div>
<div class="wrap"><h1 class="pt" id="pt"></h1><div class="tabs" id="nav"></div><div id="app">Carregando…</div></div><div id="mo"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PROV=["Solicitar plano de trabalho","Consultar interesse da empresa na renovação","Solicitar manifestação da secretaria","Encaminhar para o setor jurídico","Preparar termo aditivo","Providenciar novo processo licitatório"];
let docs=[],tab="painel",sel=null,q="",fs="",db=null,sample=null,assets=null,alerted=false,col=null,draft=null,pdfFile=null;
let localDB=null;
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fimAtual=c=>{let f=c.fim;(c.eventos||[]).forEach(e=>{if(e.novoFim&&(!f||e.novoFim>f))f=e.novoFim});return f};
const dias=c=>{const f=fimAtual(c);return f?Math.round((new Date(f+"T00:00:00")-hoje())/864e5):null};
const sem=c=>{const d=dias(c);if(d===null)return["x","Sem vigência"];if(d<0)return["x","Vencido"];if(d<=30)return["r",d+" dias"];if(d<=90)return["y",d+" dias"];return["g",d+" dias"]};
const br=d=>d?d.split("-").reverse().join("/"):"—";
const num=c=>(c.tipo==="ata"?"Ata ":"Contrato ")+c.numero;
const byNum=(a,b)=>String(a.numero).localeCompare(String(b.numero),"pt",{numeric:true});
const get=id=>docs.find(x=>x.id===id);
const EVT={"Notificação administrativa":"#d98a00","Termo aditivo de prazo":"#1e9e57","Termo aditivo de valor":"#16857a","Novo processo":"#6d4bb5","Não prorrogação":"#d93a3a","Apostilamento":"#3a78c9","Rescisão":"#555","Outro":"#8a1c3f"};
const TC=t=>EVT[t]||"#8a1c3f";
const N=v=>{v=String(v||"").trim();if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");return parseFloat(v)||0};
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function totI(){let t=0;document.querySelectorAll("#ib tr").forEach(r=>t+=N(r.querySelector(".iq").value)*N(r.querySelector(".iv").value));const e=$("#ti");if(e)e.textContent=R(t)}
const rowI=i=>`<tr style="cursor:default"><td><input class="ii" placeholder="Descrição do item" value="${esc(i.item)}"></td><td><input class="iq" inputmode="decimal" value="${esc(i.qtd)}" oninput="totI()"></td><td><input class="iv" inputmode="decimal" value="${esc(i.valor)}" oninput="totI()"></td><td><a class="rm" onclick="this.closest('tr').remove();totI()">✕</a></td></tr>`;
async function saveI(id){const it=[...document.querySelectorAll("#ib tr")].map(r=>({item:r.querySelector(".ii").value.trim(),qtd:r.querySelector(".iq").value.trim(),valor:r.querySelector(".iv").value.trim()})).filter(x=>x.item||x.qtd||x.valor);await save({...get(id),itens:it})}
let pdfFiles=[];
const arqs=c=>c.arqs||(c.pdf?[{nome:"Contrato (PDF)",url:c.pdf}]:[]);
const askTxt=(m,d="",txt=1)=>new Promise(r=>{$("#mo").innerHTML=`<div class="modal"><div><p>${esc(m)}</p>${txt?`<input id="aq" value="${esc(d)}">`:""}<br><div class="row"><button class="btn" id="ay">OK</button><button class="btn s" id="an">Cancelar</button></div></div></div>`;const f=v=>{$("#mo").innerHTML="";r(v)};$("#ay").onclick=()=>f(txt?$("#aq").value.trim():true);$("#an").onclick=()=>f(null);if(txt)$("#aq").focus()});
const askOk=m=>askTxt(m,"",0);
// Armazenamento exclusivamente local: os registros e PDFs ficam no IndexedDB deste navegador.
function abrirBanco(){return new Promise((resolve,reject)=>{const req=indexedDB.open("GestaoContratosJundiaLocal",1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains("contratos"))d.createObjectStore("contratos",{keyPath:"id"});if(!d.objectStoreNames.contains("pdfs"))d.createObjectStore("pdfs",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function tx(store,mode="readonly"){return localDB.transaction(store,mode).objectStore(store)}
function dbGetAll(store){return new Promise((resolve,reject)=>{const r=tx(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function dbPut(store,value){return new Promise((resolve,reject)=>{const r=tx(store,"readwrite").put(value);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbDelete(store,id){return new Promise((resolve,reject)=>{const r=tx(store,"readwrite").delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function dbGet(store,id){return new Promise((resolve,reject)=>{const r=tx(store).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function up(f){if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name))throw new Error("Selecione somente arquivos PDF.");const id="pdf_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);await dbPut("pdfs",{id,nome:f.name,tipo:f.type||"application/pdf",blob:f});return id}
function pdfLink(d,label){return `<a class="doc" href="#" onclick="abrirPdf('${esc(d.id||"")}','${esc(d.url||"")}');return false">${label}</a>`}
async function abrirPdf(id,url){const w=window.open("about:blank","_blank");try{if(!id&&url){if(w)w.location.href=url;else location.href=url;return}const item=await dbGet("pdfs",id);if(!item)throw new Error("O arquivo não foi encontrado neste navegador. Talvez tenha sido removido ou os dados tenham sido apagados.");const u=URL.createObjectURL(item.blob);if(w)w.location.href=u;else{const a=document.createElement("a");a.href=u;a.download=item.nome||"documento.pdf";a.click()}setTimeout(()=>URL.revokeObjectURL(u),120000)}catch(e){if(w)w.close();aviso(e.message||"Não foi possível abrir o PDF.")}}
async function addA(id){const fl=[...$("#af").files];if(!fl.length)return aviso("Escolha um PDF primeiro.");const b=$("#ba");b.disabled=true;b.textContent="Salvando…";try{const c={...get(id)},L=[...arqs(c)];for(const f of fl)L.push({nome:f.name.replace(/\.pdf$/i,""),id:await up(f)});c.arqs=L;delete c.pdf;await save(c)}catch(e){console.error(e);aviso("Não foi possível anexar: "+(e.message||e.code||"erro"));render()}}
async function renA(id,i){const c={...get(id)},L=[...arqs(c)];const n=await askTxt("Novo nome do documento:",L[i].nome);if(!n)return;L[i]={...L[i],nome:n};c.arqs=L;delete c.pdf;await save(c)}
async function delA(id,i){if(!await askOk("Remover este PDF do contrato?"))return;const c={...get(id)},L=[...arqs(c)],old=L.splice(i,1)[0];c.arqs=L;delete c.pdf;await save(c);if(old?.id)await dbDelete("pdfs",old.id)}
async function delE(id,i){if(!await askOk("Remover esta ocorrência?"))return;const c={...get(id)},old=c.eventos[i];c.eventos=c.eventos.filter((_,j)=>j!==i);await save(c);for(const d of (old?.docs||[]))if(d.id)await dbDelete("pdfs",d.id)}
let sk="criado",sd=1;
const cr=c=>c.criado||parseInt(String(c.id).slice(1),36)||0;
const cmp=(a,b)=>{const r=sk==="criado"?cr(a)-cr(b):sk==="assinatura"?(a.assinatura||"9").localeCompare(b.assinatura||"9"):sk==="numero"?byNum(a,b):sk==="fim"?(fimAtual(a)||"9").localeCompare(fimAtual(b)||"9"):String(a[sk]||"").localeCompare(String(b[sk]||""),"pt");return r*sd};
const ord=k=>{sd=sk===k?-sd:1;sk=k;render()};
const th=(k,l)=>(tab==="contrato"||tab==="ata"||tab==="painel")?`<th class="sort" onclick="ord('${k}')">${l}${sk===k?(sd>0?" ▲":" ▼"):""}</th>`:`<th>${l}</th>`;

async function save(c){

async function tgl(id,i){const c={...get(id)};c.prov=c.prov.map((p,j)=>j===i?{...p,done:!p.done}:p);await save(c)}
async function obs(id,i,v){const c={...get(id)};c.prov=c.prov.map((p,j)=>j===i?{...p,obs:v}:p);await save(c)}

async function addE(id){if(!$("#ed").value)return aviso("Informe a data.");const b=$("#be");b.disabled=true;b.textContent="Salvando…";const tipo=$("#et").value,desc=$("#edc").value,nm=$("#enm").value.trim(),fl=[...$("#ef").files],dc=[];
try{for(let i=0;i<fl.length;i++)dc.push({nome:(nm||tipo+(desc?" - "+desc:""))+(fl.length>1?" ("+(i+1)+")":""),id:await up(fl[i])})}catch(e){console.error(e);b.disabled=false;b.textContent="Registrar na linha do tempo";return aviso("Não foi possível anexar o PDF: "+(e.message||e.code||"erro")+". A ocorrência não foi registrada.")}
const c={...get(id)};c.eventos=[...(c.eventos||[]),{tipo,data:$("#ed").value,novoFim:$("#en").value,desc,docs:dc}];await save(c)}
function novo(){return`<div class="card"><h3>Importar PDF e cadastrar contrato ou ata</h3><div class="msg i">Selecione o PDF para leitura do texto e preencha os dados do cadastro. Confira todas as informações com o documento original antes de salvar.</div><input type="file" id="pf" accept="application/pdf" multiple><div class="msg i">Os PDFs e cadastros serão salvos somente neste computador e neste navegador. Não são enviados para a nuvem.</div><div id="st" class="ev" style="margin-top:6px"></div></div><div id="fm"></div>`}
function formHtml(d){const f=(k,l,t="text")=>`<div><label>${l}</label><input id="f_${k}" type="${t}" value="${esc(d[k]||"")}">${d.ev?.[k]?`<div class="ev">Trecho: “${esc(d.ev[k])}”</div>`:""}</div>`;

async function salvarNovo(){
  const er=m=>$("#er").innerHTML=`<div class="msg e">${m}</div>`,g=k=>$("#f_"+k).value.trim();
  if(!g("numero")||!g("empresa")||!g("fim"))return er("Preencha número, empresa e fim da vigência.");
  if(g("inicio")&&g("fim")<g("inicio"))return er("O fim da vigência é anterior ao início. Revise as datas.");
  if(!$("#ok").checked)return er("Marque a confirmação de conferência para salvar.");
  const b=$("#sv");b.disabled=true;b.textContent="Salvando…";
  let A2=[];try{for(const f of pdfFiles)A2.push({nome:f.name.replace(/\.pdf$/i,""),id:await up(f)})}catch(e){console.error(e);b.disabled=false;b.textContent="Salvar";return er("Não foi possível anexar o PDF: "+(e.message||e.code||"erro")+". Nada foi salvo.")}
  const c={id:"c"+Date.now().toString(36),criado:Date.now(),tipo:g("tipo"),numero:g("numero"),empresa:g("empresa"),assinatura:g("assinatura"),inicio:g("inicio"),fim:g("fim"),valor:g("valor"),objeto:g("objeto"),arqs:A2,prov:[],eventos:[],verificado:true};
  const ok=await save(c);if(!ok){b.disabled=false;b.textContent="Salvar";return}
  draft=null;pdfFiles=[];sel=c.id;tab="det";render()}
async function extrair(f){
  const st=$("#st");st.textContent="Lendo PDF…";
  try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let tx="";
    for(let i=1;i<=Math.min(p.numPages,12);i++)tx+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n";
    if(tx.trim().length<80){st.textContent="PDF sem texto (digitalizado). Preencha manualmente.";return}
    st.textContent="PDF lido com sucesso. A leitura automática dos campos por IA não está habilitada nesta versão; preencha os dados manualmente e confira com o documento original."
  }catch(e){console.error(e);st.textContent="Falha na leitura automática. Preencha manualmente."}}
async function blobParaBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function exportarBackup(){try{const pdfs=await dbGetAll("pdfs"),dados=[];for(const p of pdfs)dados.push({id:p.id,nome:p.nome,tipo:p.tipo,base64:await blobParaBase64(p.blob)});const pacote={aplicacao:"Gestão de Contratos - Jundiá RN",versao:1,dataBackup:new Date().toISOString(),contratos:docs,pdfs:dados};const blob=new Blob([JSON.stringify(pacote)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="backup-gestao-contratos-jundia-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);toast("Backup gerado com sucesso")}catch(e){console.error(e);aviso("Não foi possível gerar o backup: "+e.message)}}
function base64ParaBlob(b64,tipo){const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:tipo||"application/pdf"})}
async function importarBackup(file){if(!file)return;try{if(!await askOk("A restauração adicionará/substituirá registros com os mesmos identificadores. Deseja continuar?"))return;const pacote=JSON.parse(await file.text());if(!Array.isArray(pacote.contratos)||!Array.isArray(pacote.pdfs))throw new Error("Arquivo de backup inválido.");for(const p of pacote.pdfs)await dbPut("pdfs",{id:p.id,nome:p.nome,tipo:p.tipo,blob:base64ParaBlob(p.base64,p.tipo)});for(const c of pacote.contratos)await dbPut("contratos",c);docs=await dbGetAll("contratos");render();toast("Backup restaurado com sucesso")}catch(e){console.error(e);aviso("Não foi possível restaurar o backup: "+e.message)}}
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const i=$("#qs");if(i){e.preventDefault();i.focus()}}if(e.key==="Escape")$("#mo").innerHTML=""});
// ===== Configurações: foto de perfil e tema =====
const TEMAS=[["bordo","Bordô (padrão)","#8a1c3f","#fff"],["azul","Azul","#1f5fbf","#fff"],["verde","Verde","#1a7a4c","#fff"],["escuro","Escuro","#8a1c3f","#000"]];
const ICONE='<svg width="55%" height="55%" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg>';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function aplicarTema(t){if(!TEMAS.some(x=>x[0]===t))t="bordo";document.documentElement.setAttribute("data-tema",t)}
function setTema(t){ls.set("gc_tema",t);aplicarTema(t);render();toast("✔ Tema alterado")}
function avatar(){const f=ls.get("gc_foto"),a=$("#av");if(a)a.innerHTML=f?`<img src="${f}" alt="Perfil">`:ICONE}
function fotoArquivo(file){
  if(!file)return;if(!/^image\//.test(file.type))return aviso("Selecione um arquivo de imagem.");
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const S=256,cv=document.createElement("canvas");cv.width=cv.height=S;const x=cv.getContext("2d"),m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(u);
    if(ls.set("gc_foto",cv.toDataURL("image/jpeg",.85))){avatar();render();toast("✔ Foto atualizada")}else aviso("Não foi possível salvar a foto neste navegador.")};
  img.onerror=()=>{URL.revokeObjectURL(u);aviso("Não foi possível ler esta imagem. Tente um arquivo JPG ou PNG.")};
  img.src=u}
function removerFoto(){ls.del("gc_foto");avatar();render();toast("Foto removida")}
function config(){
  const f=ls.get("gc_foto"),t=document.documentElement.getAttribute("data-tema")||"bordo";
  return`<div class="two"><div class="card"><h3>Foto de perfil</h3><div class="row" style="gap:18px"><div class="pfp">${f?`<img src="${f}" alt="">`:ICONE}</div><div><label class="btn sm" style="margin:0;cursor:pointer">Escolher foto<input type="file" accept="image/*" style="display:none" onchange="fotoArquivo(this.files[0])"></label> ${f?'<button class="btn s sm" onclick="removerFoto()">Remover</button>':""}<div class="sub" style="margin-top:8px">A imagem é recortada em formato quadrado e fica salva somente neste navegador.</div></div></div></div>
<div class="card"><h3>Tema do site</h3><div class="temas">${TEMAS.map(([k,n,c,b])=>`<button class="tema ${t===k?"on":""}" onclick="setTema('${k}')"><span class="sw" style="background:linear-gradient(90deg,${c} 50%,${b} 50%)"></span>${n}</button>`).join("")}</div></div></div>`}

aplicarTema(ls.get("gc_tema")||"bordo");avatar();
init();
</script></body></html>
